<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Malinco Cash Runway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f7f6;--panel:#fff;--ink:#131817;--ink-2:#4f5856;--ink-3:#7a8381;--rule:#dde3e1;--accent:#2a78d6;--crit:#c23a3a;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0f1312;--panel:#171c1b;--ink:#edf1ef;--ink-2:#b3bcb9;--ink-3:#86908d;--rule:#2a3230;--accent:#3987e5;--crit:#ef7070}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding-inline:16px}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:24px;margin:0;line-height:1.15}
p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
label{font-size:13px;font-weight:600}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);font-weight:400}
button{font:inherit;font-weight:600;font-size:15px;padding:11px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--crit);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="eyebrow">Malinco Foods (Pty) Ltd</div>
  <h1>13-week cash forecast</h1>
  <p>This page is encrypted. Enter the password you were given to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label class="remember" for="rem"><input id="rem" type="checkbox"> Remember on this device</label>
  <button id="go" type="submit">Open forecast</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "malinco-cash-key-" + P.salt;

async function open(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function derive(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter}, base, 256));
}

(async () => {                                   // remembered key from an earlier visit
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { await open(b64(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }
  }
})();

if (!(window.crypto && crypto.subtle)) {
  document.getElementById("err").textContent = "This browser can't decrypt the page here. Open it via its https:// link in a current browser.";
  document.getElementById("go").disabled = true;
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    const remember = document.getElementById("rem").checked;
    const raw = await derive(document.getElementById("pw").value);
    await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)},
      await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]), b64(P.data));   // throws if the password is wrong
    if (remember) {
      let s = ""; raw.forEach(b => s += String.fromCharCode(b));
      try { localStorage.setItem(KEY, btoa(s)); } catch (e) {}
    }
    await open(raw);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Open forecast";
    err.textContent = "That password doesn't open this forecast. Check it and try again.";
  }
});
</script>
